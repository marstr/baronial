name: Build

env:
  fedora_current: 45
  fedora_previous: 44

on:
  push:
    branches: [ main, master ]
  release:
    types:
      - created

jobs:
  build-debian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Build and test Debian packages
        run: make test-deb
      - uses: actions/upload-artifact@v4
        with:
          name: Baronial Debian
          path: |
            bin/debian/*.deb
            bin/debian/*.dsc
            bin/debian/*.tar.*
            bin/debian/*.changes
            bin/debian/*.buildinfo
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Build
        run: make linux
      - name: Test
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: Baronial Linux
          path: bin/linux/baronial

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Build
        run: .\make.bat
      - name: Test
        run: go test -v ./...
      - uses: actions/upload-artifact@v4
        with:
          name: Baronial Windows
          path: bin/windows/baronial.exe

  build-darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '^1.20.0'
      - name: Build
        run: make darwin
      - name: Test
        run: make test
      - uses: actions/upload-artifact@v4
        with:
          name: Baronial Darwin
          path: bin/darwin/baronial

  build-fedoraCurrent:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v2
          with:
            fetch-depth: 0
        - name: Build
          run: |
            make bin/linux/baronial.fc${{ env.fedora_current }}.src.rpm bin/linux/baronial.fc${{ env.fedora_current }}.x86_64.rpm
        - uses: actions/upload-artifact@v4
          with:
            name: baronial.fc${{ env.fedora_current }}.src.rpm
            path: bin/linux/baronial.fc${{ env.fedora_current }}.src.rpm
        - uses: actions/upload-artifact@v4
          with:
            name: baronial.fc${{ env.fedora_current }}.x86_64.rpm
            path: bin/linux/baronial.fc${{ env.fedora_current }}.x86_64.rpm
  build-fedoraPrevious:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Build
        run: |
          make bin/linux/baronial.fc${{ env.fedora_previous }}.src.rpm bin/linux/baronial.fc${{ env.fedora_previous }}.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: baronial.fc${{ env.fedora_previous }}.src.rpm
          path: bin/linux/baronial.fc${{ env.fedora_previous }}.src.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: baronial.fc${{ env.fedora_previous }}.x86_64.rpm
          path: bin/linux/baronial.fc${{ env.fedora_previous }}.x86_64.rpm
